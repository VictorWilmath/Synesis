# A low-impact, no-calibration smoke test for VRChat.
# Webcam pose remains approximate, but the live HMD pose is sent only to align
# this arbitrary camera space with the avatar's SteamVR space.

[camera]
width = 640
height = 480
# The pose estimator measures under 10 ms on CPU; request 30 Hz so the camera,
# rather than an overly-conservative preset, is no longer the 12 Hz bottleneck.
fps = 30
# This webcam delivers a mirror-image stream.  Unmirror it before pose
# estimation so physical left/right map to VRChat's left/right slots.
mirror = true

[pose2d]
mode = "lightweight"
device = "cpu"
detect_interval = 60

[vr]
enabled = true

[calibration]
# Do not load or refine a room calibration in this rough test.
path = "calibration/rough-test-extrinsics.json"
online_refine = false

[alignment]
path = "calibration/headset_alignment.json"
capture_seconds = 5.0
min_samples = 20

[lift]
# The trained temporal lifter gives materially better motion than a single
# frame of bone geometry, while its CPU runtime is below 1 ms per frame.
method = "neural"
device = "cpu"

[osc]
# VRChat uses this HMD reference to align incoming OSC tracker coordinates.
send_head = false
# Keep rough webcam tracker locations near the real headset during VRChat's
# FBT setup. This is a smoke-test convenience, not camera calibration.
rebase_uncalibrated_to_head = true

[debug]
overlay = true
