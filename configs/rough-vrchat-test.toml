# A low-impact, no-calibration smoke test for VRChat.
# Webcam pose remains approximate, but the live HMD pose is sent only to align
# this arbitrary camera space with the avatar's SteamVR space.

[camera]
width = 640
height = 480
fps = 15

[pose2d]
mode = "lightweight"
device = "cpu"
detect_interval = 60

[vr]
enabled = true

[calibration]
# Do not load or refine a room calibration in this rough test.
path = "calibration/rough-test-extrinsics.json"
online_refine = false

[lift]
method = "geometric"

[osc]
# VRChat uses this HMD reference to align incoming OSC tracker coordinates.
send_head = true
# Keep rough webcam tracker locations near the real headset during VRChat's
# FBT setup. This is a smoke-test convenience, not camera calibration.
rebase_uncalibrated_to_head = true

[debug]
overlay = true
