# Default configuration. Copy to `configs/local.toml` and edit; the runtime
# loads `default.toml` first and overlays the local file if present.

[camera]
index = 0
# The normal VRChat path deliberately leaves the RTX 2070 to VRChat and
# SteamVR.  This is the same stable capture rate as the former rough-test
# preset; raise it only after a low-impact session is known to work.
width = 640
height = 480
fps = 30
# Webcams default to autoexposure, which hunts under artificial light and
# produces the motion blur that actually degrades keypoint quality. Lock it.
lock_exposure = true
exposure = -6          # OpenCV/DirectShow log2 scale; -6 is roughly 1/64 s
gain = 0
autofocus = false
# MJPG lets most webcams hit 30fps at 720p; YUYV usually caps at 10fps.
fourcc = "MJPG"
# The packaged test rig's webcam reports a mirror-image stream.  Flip it
# before pose estimation so physical left/right reach matching VRChat slots.
mirror = true

[pose2d]
# 'lightweight' | 'balanced' | 'performance'
mode = "lightweight"
backend = "onnxruntime"
device = "cpu"
# One static camera and one person, so the detector is nearly pure overhead.
# Re-run it every N frames or when tracking confidence collapses.
detect_interval = 60
bbox_padding = 0.25
min_keypoint_score = 0.35
# Fraction of body keypoints that must clear min_keypoint_score for the frame
# to count as a successful track.
min_valid_ratio = 0.5

[vr]
enabled = true
# Poll rate for SteamVR device poses. The compositor runs at display rate;
# we only need enough to interpolate onto camera frames.
poll_hz = 90

[calibration]
# There is no calibration step. While `bodytracker run` tracks, it pairs the
# head and wrists the camera sees with the headset and controllers SteamVR
# reports, and solves the camera's position, lens and frame delay from them.
# Trackers are sent once the solve is trustworthy; the result is saved here
# and reused, and re-solved automatically if the camera is moved.
path = "calibration/camera.json"
# Starting guesses, both measured by the solve.
initial_fov_deg = 62.0
initial_latency_s = 0.05
# Frame delays searched, in seconds. A webcam in a dim room, with exposure it
# cannot lock, can deliver frames well over 200 ms late.
max_latency_s = 0.50
latency_step_s = 0.02
# New samples are considered at this rate, and kept only if something moved
# at least min_sample_spacing_m since every sample already stored.
sample_rate_hz = 10.0
min_sample_spacing_m = 0.04
min_samples = 150
max_samples = 900
# Solves run on the CPU in the background, never on the GPU VRChat needs.
solve_interval_s = 3.0
refine_interval_s = 30.0
ransac_threshold_px = 10.0
# Acceptance, at 640x480: most samples must agree, the fit must be tight and
# the camera position known to within a few centimetres. Tracking starts at
# this precision and keeps refining while you play.
min_inlier_ratio = 0.6
max_rms_px = 8.0
max_position_std_m = 0.08
max_focal_std = 0.04
# A median error this large over monitor_frames samples means the camera moved.
moved_error_px = 30.0
monitor_frames = 40

[body]
# Height is measured from the headset while tracking and saved here. It scales
# the generic bone-length prior.
height_m = 1.75
path = "calibration/body.json"

[lift]
# The temporal model runs on CPU in under 1 ms and tracks more naturally than
# the single-frame geometric fallback.  It leaves the GPU to VRChat/SteamVR.
method = "neural"
device = "cpu"
model_path = "models/lifter.onnx"
window = 27
# If the solved head lands further than this from where the headset says it is,
# the pose model is probably tracking someone else, so stop anchoring to it.
max_head_residual_m = 0.35
# Anchored only. Solves every joint's depth at once against the headset, the
# controllers and the floor. Off, depth comes from one bone at a time, which on
# a 640x480 webcam can put a foot half a metre from where it is.
refine = true

[filter]
# One Euro. min_cutoff sets the smoothing when you are still, beta how fast the
# filter opens up once you move. Measured on a synthetic body swaying and
# raising its knees at 15 fps with 2 px of keypoint noise, from the moment it
# moves to the moment VRChat sees the tracker, 150 ms of camera and processing
# included; the wobble is standing still at 12 fps with 3 px of noise:
#
#   min_cutoff  beta   delay, hip / feet   hip wobble at rest
#   1.0         0.35   370 / 330 ms        14 mm
#   1.0         2.0    340 / 280 ms        15 mm
#   1.0         8.0    290 / 250 ms        17 mm   <- default
#
# The default leans toward low delay, because feet dragging behind you reads as
# broken in VR in a way that a little wobble does not.
min_cutoff = 1.0
beta = 8.0
d_cutoff = 1.0
# Rotations get SLERP smoothing instead, expressed as a per-second rate.
rotation_alpha = 0.35
# How long to keep sending the last good value for a joint that dropped out
# before marking it invalid.
hold_last_valid_s = 0.5

[solve]
enforce_bone_lengths = true
floor_clamp = true
# Feet below this height are snapped to the floor plane.
floor_epsilon_m = 0.03

[osc]
# Where the trackers go.
#   "vrchat"  VRChat's own OSC trackers, on `port`.
#   "vmt"     Virtual SteamVR trackers through the Virtual Motion Tracker
#             driver, on `vmt_port`. VRChat, and every other SteamVR game,
#             then sees ordinary trackers and calibrates them like Vive
#             trackers. Needs VMT installed:
#             https://github.com/gpsnmeajp/VirtualMotionTracker/releases
#   "auto"    "vmt" if VMT is installed, otherwise "vrchat".
target = "vrchat"
host = "127.0.0.1"
port = 9000
vmt_port = 39570
# VMT device type: 7 emulates a Vive tracker, 1 is VMT's plain tracker. SteamVR
# keeps whichever it saw first until it is restarted.
vmt_mode = 7
# VRChat's IK compensates better with fewer trackers, so default to the
# minimal useful set. Valid roles: hip, chest, left_foot, right_foot,
# left_knee, right_knee, left_elbow, right_elbow.
roles = ["hip", "left_foot", "right_foot"]
# Trackers are already in SteamVR room space, which is VRChat's tracking
# space. Sending the head reference would make VRChat move them a second time.
send_head = false
send_rate_hz = 60

[debug]
overlay = true
print_stats_interval_s = 2.0
